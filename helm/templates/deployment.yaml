---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
  labels:
      app.kubernetes.io/name: {{ .Values.appName }}
  annotations:
    source_url: "git@github.com:krzysztofkarolak/image-fetcher-ha.git"
spec:
  replicas: 1
  minReadySeconds: 10
  progressDeadlineSeconds: 60

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.appName }}

  template:
    metadata:
      name: {{ .Values.appName }}
      namespace: {{ .Values.namespace }}
      labels:
        app.kubernetes.io/name: {{ .Values.appName }}
      annotations:
        source_url: "git@github.com:krzysztofkarolak/image-fetcher-ha.git"
    spec:
      restartPolicy: Always

      imagePullSecrets:
        - name: {{ .Values.registrySecretName }}

      containers:
        - name: image-fetcher
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: GOOGLE_APP_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  key: GOOGLE_APP_CREDENTIALS
                  name: {{ .Values.secretName }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ .Values.gcsSecretFileLocation }}
            - name: HA_IMAGE_URL
              value: {{ .Values.haImageUrl }}
            - name: HA_URL
              valueFrom:
                secretKeyRef:
                  key: HA_URL
                  name: {{ .Values.secretName }}
            - name: HA_BEARER
              valueFrom:
                secretKeyRef:
                  key: HA_BEARER
                  name: {{ .Values.secretName }}
            - name: HA_STATE_ENTITY_ID
              value: {{ .Values.haStateEntityId }}
            - name: GCS_BUCKET_NAME
              value: {{ .Values.cloudStorageBucketName }}
            {{- if .Values.dashboards.url }}
            - name: DASHBOARDS_URL
              value: {{ .Values.dashboards.url | quote }}
            - name: DASHBOARDS_TTL
              value: {{ .Values.dashboards.ttlSeconds | default 60 | quote }}
            {{- end }}
            {{- if .Values.dashboards.fromConfigMap }}
            - name: DASHBOARDS_DIR
              value: /srv/dashboards
            {{- end }}

          {{- if .Values.dashboards.fromConfigMap }}
          volumeMounts:
            {{- range $name, $_ := (include "image-fetcher.dashboardDirs" . | fromYaml) }}
            - name: dash-{{ $name }}
              mountPath: /srv/dashboards/{{ $name }}
              readOnly: true
            {{- end }}
          {{- end }}

          resources:
            requests:
              memory: "64Mi"
              cpu: "20m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /index.php?health=true
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 60
            timeoutSeconds: 25

      {{- if .Values.dashboards.fromConfigMap }}
      volumes:
        {{- range $name, $_ := (include "image-fetcher.dashboardDirs" . | fromYaml) }}
        - name: dash-{{ $name }}
          configMap:
            name: {{ $.Values.appName }}-dash-{{ $name }}
        {{- end }}
      {{- end }}
