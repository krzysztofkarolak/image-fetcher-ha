device:
  width: 800          # 7.3" = 800x480, 5.7" = 600x448, 4" = 640x400
  height: 480
  palette: spectra6   # spectra6 | acep7
  dither: false

template: dashboard.svg.twig

vars:
  title: Home

# Jinja templates rendered by Home Assistant in a single /api/template call.
# Round values and avoid minutes/seconds: every change triggers a redraw.
data:
  date: "{{ now().date().isoformat() }}"

  temp_out: "{{ states('sensor.openweathermap_temperature') | float(0) | round(0) | int }}"
  weather:  "{{ states('weather.forecast_home') }}"
  temp_max: "{{ state_attr('weather.forecast_home', 'temperature') | float(0) | round(0) | int }}"

  temp_in:  "{{ states('sensor.living_room_temperature') | float(0) | round(1) }}"
  hum_in:   "{{ (states('sensor.living_room_humidity') | float(0) / 5) | round(0) * 5 | int }}"
  temp_bed: "{{ states('sensor.bedroom_temperature') | float(0) | round(1) }}"

  windows_open: >-
    {{ states.binary_sensor
       | selectattr('attributes.device_class', 'defined')
       | selectattr('attributes.device_class', 'eq', 'window')
       | selectattr('state', 'eq', 'on')
       | map(attribute='name') | list | tojson }}

  door_locked: "{{ is_state('lock.front_door', 'locked') }}"

  power_kw: "{{ ((states('sensor.house_power') | float(0) / 1000) * 2) | round(0) / 2 }}"
  energy_today: "{{ states('sensor.energy_today') | float(0) | round(0) | int }}"

  events: >-
    {% set e = 'calendar.family' %}
    {% if state_attr(e, 'message') %}
      {{ [{'time': as_timestamp(state_attr(e, 'start_time')) | timestamp_custom('%b %d %H:%M'),
           'text': state_attr(e, 'message')}] | tojson }}
    {% else %}[]{% endif %}

  bins: "{{ states('sensor.waste_collection') }}"
